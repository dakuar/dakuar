<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="975" height="260" viewBox="0 0 975 260" role="img" aria-labelledby="banner-title">
  <!--
    Fase 1, prueba de viabilidad. No es la escena.
    Contornos previstos de IBM Plex Mono y Noto Sans JP,
    ambas con licencia SIL Open Font License 1.1:
    https://openfontlicense.org/open-font-license-official-text/
    Esta prueba todavía no incrusta glifos.
    Marca visual CSS: círculo que se desplaza y cuadrado que late.
    Pose base (sin animación): círculo dentro del aro izquierdo y cuadrado opaco.
  -->
  <title id="banner-title">Torre de la Catedral de Panamá Viejo en arte ASCII con un gato que toma café en lo alto. Enlace a dakuar.com</title>
  <style>
    .slide {
      transform: translate(0px, 0px);
      animation: slide 6s linear infinite;
    }
    .pulse {
      opacity: 1;
      animation: pulse 3s linear infinite;
    }
    @keyframes slide {
      0% { transform: translate(0px, 0px); }
      50% { transform: translate(480px, 0px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.08; }
      100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <rect x="0" y="0" width="975" height="260" rx="15" fill="#f6f8fa"/>
  <circle cx="40" cy="40" r="10" fill="#2f6fa3"/>
  <circle cx="180" cy="130" r="52" fill="none" stroke="#6b5842" stroke-width="3"/>
  <circle cx="660" cy="130" r="52" fill="none" stroke="#6b5842" stroke-width="3" stroke-dasharray="6 6"/>
  <g class="slide">
    <circle cx="180" cy="130" r="46" fill="#2f6fa3"/>
  </g>
  <rect class="pulse" x="800" y="90" width="80" height="80" rx="8" fill="#b07d00"/>
</svg>
